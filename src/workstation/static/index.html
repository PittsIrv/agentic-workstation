<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workstation</title>
<style>
:root{--bg:#f6f5f1;--fg:#23221f;--mute:#6b6963;--card:#fff;--line:#dcd9cf;--acc:#2f5f8f;--ask:#b8740f;--ask-bg:#fbf0dc;--ask-fg:#5c3a05;--run:#2f6fb5;--rev:#6a5acd;--ok:#2a8a63;--ok-bg:#e4f3ec;--bad:#c23b3b;--bad-bg:#f9e3e3;--mid-bg:#ecebe6;
--claude:#b4572e;--gpt:#2a7a62;--gemini:#3b6fd0;--human:#23221f;
--font:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--fg:#ebe9e3;--mute:#a9a69c;--card:#242422;--line:#3a3935;--acc:#8ab4e0;--ask:#e3a53c;--ask-bg:#3b2a10;--ask-fg:#f6d292;--run:#6fa3dd;--rev:#a79af0;--ok:#5fc094;--ok-bg:#1f3a2e;--bad:#e06464;--bad-bg:#432222;--mid-bg:#2f2f2c;--claude:#e08a5f;--gpt:#5fc0a0;--gemini:#86a8f0;--human:#ebe9e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b19;--fg:#ebe9e3;--mute:#a9a69c;--card:#242422;--line:#3a3935;--acc:#8ab4e0;--ask:#e3a53c;--ask-bg:#3b2a10;--ask-fg:#f6d292;--run:#6fa3dd;--rev:#a79af0;--ok:#5fc094;--ok-bg:#1f3a2e;--bad:#e06464;--bad-bg:#432222;--mid-bg:#2f2f2c;--claude:#e08a5f;--gpt:#5fc0a0;--gemini:#86a8f0;--human:#ebe9e3;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);margin:0;padding:18px max(16px,env(safe-area-inset-left)) 48px}
a{color:var(--acc)} h1{font:500 22px/1.2 var(--font);margin:0} h2{font:500 16px/1.3 var(--font);margin:0 0 10px;display:flex;gap:8px;align-items:baseline} h2 .cnt{font-size:12px;color:var(--mute);font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
nav{display:flex;gap:4px;flex-wrap:wrap} nav a{text-decoration:none;color:var(--fg);padding:5px 12px;border-radius:999px;border:1px solid transparent;font-size:14px} nav a[aria-current="page"]{border-color:var(--line);background:var(--card)}
.sub{color:var(--mute);font-size:13px;margin:2px 0 16px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.k{display:block;font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.big{font:500 17px/1.35 var(--font);display:block}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start} @media(max-width:860px){.cols{grid-template-columns:1fr}}
section{margin-bottom:18px}
.card{margin-bottom:10px} .card .t{font-weight:500} .meta{font-size:12.5px;color:var(--mute);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--mid-bg);color:var(--fg);white-space:nowrap}
.pill.ask{background:var(--ask-bg);color:var(--ask-fg)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.run{background:transparent;border:1px solid var(--run);color:var(--run)}
.who{font-weight:500} .who.claude{color:var(--claude)} .who.gpt{color:var(--gpt)} .who.gemini{color:var(--gemini)} .who.human{color:var(--human)} .who.system{color:var(--mute)}
.bucket{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px} .bucket.overdue{color:var(--bad)}
button,.btn{font:13.5px var(--font);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--acc)} button.primary{background:var(--acc);border-color:var(--acc);color:#fff} button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dc .q{font:500 16px/1.35 var(--font);margin:2px 0 6px} .dc .ctx{font-size:13px;color:var(--mute)}
.opt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.recs{margin-top:8px;font-size:13.5px} .recs div{margin-top:3px}
.agents{display:grid;gap:6px} .ag{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px} .ag small{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mute)} .dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.wait{background:var(--ask)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;border-left:3px solid var(--line)}
.msg.claude{border-left-color:var(--claude)} .msg.gpt{border-left-color:var(--gpt)} .msg.human{border-left-color:var(--human)}
.msg.notice{background:transparent;border:1px dashed var(--line);font-size:13px;color:var(--mute);padding:6px 12px}
.msg .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13px;margin-bottom:4px} .msg .hd .at{color:var(--mute);font-size:12px}
.body p{margin:.35em 0} .body ul{margin:.3em 0 .3em 1.2em;padding:0} .body code{font:13px var(--mono);background:var(--mid-bg);padding:0 4px;border-radius:4px}
.struct{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13.5px}
textarea,input,select{font:14px var(--font);width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--fg)}
textarea{min-height:76px;resize:vertical}
.composer{position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.empty{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{font-weight:500;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
.cov li{font-size:13px} .cov{margin:0;padding-left:18px}
.banner{background:var(--ask-bg);color:var(--ask-fg);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.err{color:var(--bad);font-size:13px}
.note{font-size:12.5px;color:var(--mute);margin-top:3px}
.hidden{display:none} .snz{margin:-6px 0 12px 4px} .snz button{padding:1px 8px;font-size:12px} .why{margin:-6px 0 6px 4px;color:var(--ask-fg)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start} @media(max-width:860px){.two{grid-template-columns:1fr}}
.wait{margin:2px 0 0} .more{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13.5px}
.steps{margin:0;padding-left:20px} .steps>li{margin-bottom:14px} .steps h3{font:500 15px/1.3 var(--font);margin:0 0 4px}
pre.cmd{font:12.5px/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:6px 0;max-height:260px;overflow:auto}
.ok-line{color:var(--ok);font-weight:500}
.agwork{margin:2px 0 8px 14px;font-size:12.5px;color:var(--mute)}
@media(max-width:520px){.bar{grid-template-columns:78px 1fr 60px}.row input,.row textarea{min-width:0;flex:1 1 100%}}
.bars{display:grid;gap:8px} .bar{display:grid;grid-template-columns:92px 1fr 72px;gap:10px;align-items:center;font-size:13.5px}
.track{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--mid-bg)} .track span{display:block;height:100%}
.p-Focus{background:var(--acc)} .p-Entertainment{background:var(--ask)} .p-Other{background:var(--mute)} .p-Untagged{background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:8px 0} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="top"><h1>Workstation</h1>
<nav><a href="#/" data-nav="home">Home</a><a href="#/inbox" data-nav="inbox">Inbox <span id="inboxcnt" class="pill"></span></a><a href="#/decisions" data-nav="decisions">Decisions</a><a href="#/tasks" data-nav="tasks">Tasks</a><a href="#/threads" data-nav="threads">Threads</a><a href="#/discussions" data-nav="discussions">Discussions</a><a href="#/review" data-nav="review">Review</a><a href="#/time" data-nav="time">Time</a><a href="#/activity" data-nav="activity">Activity</a><a href="#/setup" data-nav="setup">Set up</a></nav></div>
<div class="sub" id="sub">Loading…</div>
<div id="offline" class="banner hidden" role="status"></div>
<div id="nowbar" class="banner hidden" role="status"></div>
<main id="view"></main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const link = (url, label) => /^(https?:\/\/|#\/)/.test(url || "") ? `<a href="${esc(url)}"${url.startsWith("#") ? "" : ' target="_blank" rel="noopener noreferrer"'}>${esc(label)}</a>` : esc(label);
let OWNER = "owner";  // replaced from /api/principals at start
let AGENT_IDS = ["claude", "gpt", "gemini"];  // replaced from /api/principals: every agent kind, added ones included
const NAMES = {owner: "Owner", claude: "Claude", gpt: "GPT", gemini: "Gemini", system: "Workstation"};
const who = id => `<span class="who ${esc(id)}${id === OWNER ? " human" : ""}">${esc(NAMES[id] || id)}</span>`;
const fmt = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}); };
const ago = iso => { if (!iso) return "never"; const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
function md(t) {
  const lines = esc(t).split(/\n/); let out = "", inList = false;
  for (const l of lines) {
    const li = l.match(/^\s*[-*•]\s+(.*)/) || l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (l.trim()) out += "<p>" + inline(l.replace(/^#+\s*/, "")) + "</p>";
  }
  return out + (inList ? "</ul>" : "");
}
const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, credentials: "same-origin",
    headers: {"Content-Type": "application/json", "X-Workstation": "1", ...(opts.headers || {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 401) { signedOut(); throw new Error("signed out"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (typeof j.detail === "string" ? j.detail : j.detail ? JSON.stringify(j.detail) : r.statusText));
  return j;
}
function signedOut() {
  $("#view").innerHTML = `<div class="card"><div class="t">Not signed in</div><p>In the project folder run <code>uv run ws open</code>; it opens a one-time sign-in link.</p></div>`;
  $("#sub").textContent = "";
}
const STATUS_PILL = {inbox: "", ready: "", in_progress: "run", blocked: "bad", needs_review: "ask", done: "ok", canceled: ""};
const pill = (s, cls) => `<span class="pill ${cls ?? STATUS_PILL[s] ?? ""}">${esc(String(s).replace(/_/g, " "))}</span>`;

// ---------- Home ----------
const BUCKETS = [["overdue", "Overdue"], ["today", "Today"], ["this_week", "Next 7 days"], ["undated", "No date"], ["later", "Later"]];
function taskCard(t, extra = "") {
  const src = t.provenance?.confidence ? `${t.source_system} · ${t.provenance.confidence.replace(/_/g, " ")}` : t.source_system;
  return `<div class="card"><div class="row" style="margin:0;justify-content:space-between"><a class="t" href="#/tasks/${esc(t.id)}">${esc(t.title)}</a><span>${t.reviews.length ? pill(NAMES[t.reviews.at(-1).by] + ": " + t.reviews.at(-1).verdict, t.reviews.at(-1).verdict === "approve" ? "ok" : "ask") + " " : ""}${pill(t.status)}</span></div>
  ${extra}<div style="font-size:14px;margin-top:2px">→ ${esc(t.action)}</div>
  <div class="meta"><span>${esc(t.project)}</span><span>owner ${who(t.owner)}</span>${t.due_local ? `<span>due ${esc(t.due_local)}</span>` : ""}<span>from ${who(t.created_by)} via ${esc(src)}</span>${t.thread_id ? `<a href="#/threads/${esc(t.thread_id)}">thread</a>` : ""}${t.artifacts.length ? `<span>${t.artifacts.length} artifact(s)</span>` : ""}</div>
  ${t.why ? `<div class="meta">Why: ${esc(t.why)}</div>` : ""}
  <div class="row">${quickActions(t)}</div></div>`;
}
function quickActions(t) {
  const b = (s, label, primary) => `<button ${primary ? 'class="primary"' : ""} data-task="${esc(t.id)}" data-v="${t.version}" data-status="${s}">${label}</button>`;
  if (t.status === "needs_review") return b("done", "Accept", true) + b("in_progress", "Send back");
  if (t.status === "blocked") return b("ready", "Unblocked");
  if (t.owner !== OWNER) return "";
  return (t.status !== "in_progress" ? b("in_progress", "Start") : "") + b("done", "Done", true) + b("canceled", "Dismiss");
}
function decisionCard(d, full, extra = "") {
  const recs = (d.recommendations || []).map(r => `<div>${who(r.agent)}${r.mode === "critique" ? " (after critique)" : ""}: ${esc(r.summary)}${r.message_id && d.thread_id ? ` <a href="#/threads/${esc(d.thread_id)}">source</a>` : ""}</div>`).join("");
  const opts = d.options.map(o => `<div class="opt"><span>${esc(o.label)}${o.detail ? `<br><small class="meta">${esc(o.detail)}</small>` : ""}</span>${d.status === "pending" ? `<button class="primary" data-approve="${esc(d.id)}" data-o="${esc(o.id)}" data-label="${esc(o.label)}">Approve</button>` : (d.option_id === o.id ? pill("chosen", "ok") : "")}</div>`).join("");
  return `<div class="card dc"><div class="row" style="margin:0;justify-content:space-between"><span class="k" style="margin:0">${esc(d.urgency === "high" ? "Urgent decision" : "Decision")} · by ${esc(NAMES[d.created_by] || d.created_by)} · ${esc(fmt(d.created_at))}</span>${pill(d.status, d.status === "pending" ? "ask" : d.status === "approved" ? "ok" : "")}</div>
  ${extra}<div class="q">${esc(d.question)}</div>${d.context ? `<div class="ctx">${esc(d.context)}</div>` : ""}
  ${recs ? `<div class="recs"><span class="k">Positions</span>${recs}</div>` : ""}${opts}
  ${(d.evidence || []).length ? `<div class="meta">Evidence: ${d.evidence.map(e => link(e.url, e.label)).join(" · ")}</div>` : ""}
  ${d.status === "pending" ? `<div class="row"><input class="dnote" placeholder="Reason (optional)"><input class="drev" placeholder="Revisit when (optional)"></div><div class="row"><button data-resolve="${esc(d.id)}" data-s="deferred">Defer</button><button data-resolve="${esc(d.id)}" data-s="rejected">Reject all</button><span class="note">Only you can resolve this. Approving assigns ${who(d.follow_up_owner)} an engineering task.</span></div>`
    : `<div class="meta">Resolved by ${who(d.resolved_by)} ${esc(fmt(d.resolved_at))}${d.note ? " — " + esc(d.note) : ""}${d.resulting_task ? ` · <a href="#/tasks/${esc(d.resulting_task)}">resulting task</a>` : ""}</div>${d.revisit ? `<div class="meta">Revisit when: ${esc(d.revisit)}</div>` : ""}
    <div class="row"><button data-rec="copy" data-id="${esc(d.id)}">Copy as decision record</button><button data-rec="download" data-id="${esc(d.id)}">Download .md</button><span class="note" data-recmsg></span></div>`}</div>`;
}
function agentRows(agents) {
  return agents.map(a => {
    const board = a.runtime === "board-pickup";
    const state = a.running ? ["wait", `working on ${a.running}`] : board ? ["on", "works through the board"] : a.available ? ["on", "ready"] : a.pull_fallback ? ["wait", "CLI unavailable · session pickup"] : ["off", "offline"];
    return `<div class="ag"><span><span class="dot ${state[0]}"></span>${who(a.id)}${board || (!a.available && String(a.reason).replace(/\s+/g, "-") === a.runtime) ? "" : ` <small>${esc(a.runtime)}</small>`}</span><small>${esc(state[1])}${a.waiting ? ` · ${a.waiting} waiting` : ""} · last reply ${esc(ago(a.last_reply_at))}</small></div>
    ${(!a.available && !board) || a.last_failure ? `<small class="meta" style="margin:-2px 0 4px 14px">${esc(a.available ? "last failure: " + (a.last_failure || "") : a.reason)}</small>` : ""}`;
  }).join("");
}
const waited = sec => sec < 90 ? "just now" : sec < 5400 ? Math.round(sec / 60) + " min" : sec < 172800 ? Math.round(sec / 3600) + " h" : Math.round(sec / 86400) + " d";
const CUT = 5;
function agentsSection(h) {
  const work = Object.fromEntries((h.agent_work || []).map(w => [w.id, w]));
  return h.agents.map(a => {
    const w = work[a.id];
    const lines = w ? [w.waiting_on_owner ? `Waiting on you: ${w.waiting_on_owner}` : "", w.working_count ? "Working on: " + w.working_on.map(t => `<a href="#/tasks/${esc(t.id)}">${esc(t.title)}</a>`).join(", ") + (w.working_count > w.working_on.length ? ` and ${w.working_count - w.working_on.length} more` : "") : ""].filter(Boolean) : [];
    return agentRows([a]) + (lines.length ? `<div class="agwork">${lines.join(" · ")}</div>` : "");
  }).join("");
}
async function renderHome() {
  const [h, nn] = await Promise.all([api("/api/home"), api("/api/needs-now?full=true")]);
  $("#sub").textContent = `${new Date(h.now).toLocaleString([], {weekday: "long", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"})} · ${h.tz}`;
  const mine = h.actions.filter(t => t.status !== "needs_review" && t.status !== "blocked");
  let groups = "";
  for (const [b, label] of BUCKETS) {
    const ts = mine.filter(t => t.bucket === b);
    if (ts.length) groups += `<div class="bucket ${b}">${label} · ${ts.length}</div>` + ts.map(t => taskCard(t)).join("");
  }
  const setup = h.first_item ? "" : await api("/api/setup");
  $("#view").innerHTML = `
  ${h.first_item ? "" : `<section><h2>Get started <span class="cnt">connect your first agent</span></h2>${setupPanel(setup)}</section>`}
  <section><div class="more"><h2 style="margin:0">Needs you now <span class="cnt">${nn.items.length} due</span></h2><a href="#/inbox">Inbox</a></div>
  ${remindersLine(nn)}
  ${nn.items.slice(0, CUT).map(inboxRow).join("") || `<div class="card"><span class="empty">Nothing needs you right now. ${nn.waiting_not_due ? nn.waiting_not_due + " item(s) are waiting but not due yet. " : ""}${nn.snoozed.length ? nn.snoozed.length + " snoozed. " : ""}When an agent needs a decision, a review or an approval, it shows up in the <a href="#/inbox">Inbox</a> and here once it is due. ${h.first_item ? "" : "Finish the steps above to connect one."}</span></div>`}
  ${nn.items.length > CUT ? `<a href="#/inbox">${nn.items.length - CUT} more due in the Inbox</a>` : ""}</section>
  <div class="two">
    <section id="home-time"><h2>Your time</h2><div class="card"><span class="empty">Loading…</span></div></section>
    <section><h2>Your agents</h2><div class="card"><div class="agents">${agentsSection(h)}</div></div>
      <h2 style="margin-top:16px">Spend</h2><div class="card"><span class="empty">Not connected. Nothing reports what your agents cost yet; when a source exists it shows here.</span></div></section>
  </div>
  <section><h2>Your tasks <span class="cnt">${mine.length} open</span></h2>${groups || '<p class="empty">No tasks of yours are open. Add one below, or let an agent propose one.</p>'}
    <details class="card"><summary>Add a task</summary>${taskForm(h.projects)}</details></section>
  <div class="two">
    <section><h2>Threads <span class="cnt">${h.threads.length}</span></h2>
      ${h.threads.slice(0, 6).map(t => `<div class="card"><a class="t" href="#/threads/${esc(t.id)}">${esc(t.title)}</a>${t.pending ? ` ${pill(t.pending + " agent(s) working", "run")}` : ""}<div class="note">${t.last ? `${who(Object.keys(NAMES).find(k => NAMES[k] === t.last.author) || "system")}: ${esc(t.last.text)}` : "No messages"} · ${esc(ago(t.updated_at))}</div></div>`).join("") || '<p class="empty">No threads yet. A thread lets you ask Claude and GPT the same question and compare.</p>'}
      <a href="#/threads">All threads / start one</a></section>

function msgView(m, t) {
  if (m.kind === "notice") return `<div class="msg notice">${esc(m.text)} <span class="at">· ${esc(fmt(m.at))}</span></div>`;
  const d = m.dispatch, s = m.structured || {}, rt = m.runtime || {};
  const label = d ? (d.mode === "critique" ? `critique of #${d.target_seq}` : "independent reply") : "";
  const saw = d?.context?.message_seqs?.length ? `saw #${d.context.message_seqs[0]}–#${d.context.message_seqs.at(-1)}` : "";
  const struct = (s.position || (s.options || []).length || s.verdict || (s.proposed_tasks || []).length) ? `<div class="struct">
    ${s.position ? `<div><span class="k" style="display:inline">Position</span> ${esc(s.position)}</div>` : ""}
    ${(s.options || []).length ? `<div><span class="k" style="display:inline">Options</span> ${s.options.map(esc).join(" · ")}</div>` : ""}
    ${s.verdict ? `<div><span class="k" style="display:inline">Verdict</span> ${pill(s.verdict, s.verdict === "approve" ? "ok" : "ask")}</div>` : ""}
    ${(s.proposed_tasks || []).map(p => `<div class="row" style="margin-top:4px"><span>Proposed task: ${esc(p.title)} (${esc(NAMES[p.owner] || p.owner)})</span><button data-propose='${esc(JSON.stringify({title: p.title, owner: p.owner === "claude" ? "claude" : OWNER, thread_id: t.id, project_id: t.project_id, why: "Proposed by " + (NAMES[m.author] || m.author) + " in thread #" + m.seq}))}'>Create task</button></div>`).join("")}</div>` : "";
  const sugg = (m.suggested_mentions || []).map(a => `<button data-insert="@${esc(a)} ">Ask ${esc(NAMES[a] || a)}</button>`).join("");
  return `<div class="msg ${esc(m.author)}${m.author === OWNER ? " human" : ""}" id="m${m.seq}"><div class="hd"><span>#${m.seq}</span>${who(m.author)}${label ? pill(label) : ""}${rt.runtime ? `<span class="at">${esc(rt.runtime)}${rt.model ? " · " + esc(rt.model) : ""}</span>` : ""}${saw ? `<span class="at">${esc(saw)}</span>` : ""}<span class="at">${esc(fmt(m.at))}</span></div>
  <div class="body">${md(m.text)}</div>${struct}${sugg ? `<div class="row">${sugg}<span class="note">Agent suggested; nothing is sent until you ask.</span></div>` : ""}</div>`;
}

async function updateNowBar() {

    else if (nn.items.length && !r.quiet_now) bar.innerHTML = `<b>${nn.items.length} item${nn.items.length === 1 ? "" : "s"} need${nn.items.length === 1 ? "s" : ""} you now.</b> <a href="#/">See why on Home</a>`;

function askRow(e) {
  const lines = [e.blocked && `<div class="note"><b>Blocked:</b> ${esc(e.blocked)}</div>`,
                 e.cost_of_waiting && `<div class="note"><b>If it waits:</b> ${esc(e.cost_of_waiting)} <span title="Written by the agent, not checked">(agent's words)</span></div>`].filter(Boolean).join("");
  const body = e.text ? `<div class="body" style="white-space:pre-wrap;margin-top:6px">${esc(e.text)}</div>` : "";
  const ref = e.url ? ` · ${link(e.url, "link")}` : "";
  const a = e.id;
  const actions = e.kind === "approval"
    ? `<div class="row"><input class="anote" placeholder="Note (optional)" style="flex:1;min-width:160px"><button data-ans="${esc(a)}" data-res="approved" data-label="approve" class="primary">Approve</button><button data-ans="${esc(a)}" data-res="declined" data-label="decline">Decline</button><button data-ans="${esc(a)}" data-res="dismissed" data-label="dismiss">Dismiss</button></div>`
    : `<div class="row"><textarea class="anote" placeholder="Your answer" style="min-height:52px"></textarea></div><div class="row"><button data-ans="${esc(a)}" data-res="answered" class="primary">Answer</button><button data-ans="${esc(a)}" data-res="dismissed" data-label="dismiss">Dismiss</button></div>`;
  return `<div class="card ib" data-ask="${esc(a)}"><div class="row" style="margin:0;justify-content:space-between"><span class="t">${esc(e.title)}</span><span>${e.overdue ? pill("overdue", "bad") + " " : ""}${e.urgency === "high" ? pill("high", "ask") + " " : e.urgency === "low" ? pill("low") + " " : ""}${pill(KIND[e.kind] || e.kind, "")}</span></div>
  <div class="meta wait"><span>${who(e.asked_by)} · ${esc(e.project || "no project")}</span><span>waiting ${esc(waited(e.waiting_s))}</span>${e.due_at ? `<span>due ${esc(fmt(e.due_at))}</span>` : ""}${ref}</div>
  ${lines}${body}${actions}<div class="err"></div></div>`;
}
const SNOOZES = [[60, "1 h"], [240, "4 h"], [1440, "1 day"]];
function snoozeBar(e) {
  if (e.snoozed_until) return `<div class="note snz">Snoozed until ${esc(fmt(e.snoozed_until))}. It stays out of Needs you now until then. <button data-unsnooze="${esc(e.key)}">Unsnooze</button></div>`;
  return `<div class="note snz">Snooze: ${SNOOZES.map(([m, l]) => `<button data-snooze="${esc(e.key)}" data-min="${m}">${l}</button>`).join(" ")}</div>`;
}
function inboxRow(e) {
  return `<div class="ibw">${inboxCard(e)}${e.why ? `<div class="note why"><b>Why now:</b> ${esc(e.why)}</div>` : ""}${snoozeBar(e)}</div>`;
}
function inboxCard(e) {
  const head = `<div class="meta wait"><span>${who(e.asked_by)} · ${esc(e.project || "no project")}</span><span>waiting ${esc(waited(e.waiting_s))}</span>${e.overdue ? pill("overdue", "bad") : ""}${e.urgency === "high" ? pill("high", "ask") : ""}</div>`;
  if (e.source === "decision") return decisionCard(e.decision, true, head);
  if (e.source === "task") return taskCard(e.task, head);
  return askRow(e);
}
async function renderInbox() {
  const ib = await api("/api/inbox");
  const cnt = $("#inboxcnt"); cnt.textContent = ib.items.length; cnt.classList.toggle("ask", ib.items.length > 0);
  $("#sub").textContent = "Everything an agent is waiting on you for, most urgent first: overdue, then high, normal, low; then the earliest deadline, then the longest wait.";
  const done = ib.answered.map(a => `<tr><td>${who(a.asked_by)}</td><td>${esc(a.title)}</td><td>${esc(a.resolution || a.status)}${a.note ? ": " + esc(a.note) : ""}</td><td>${esc(fmt(a.closed_at))}</td></tr>`).join("");
  $("#view").innerHTML = `<section><h2>Needs you <span class="cnt">${ib.items.length}</span></h2>
  ${ib.items.map(inboxRow).join("") || '<div class="card"><span class="empty">Nothing is waiting on you. When an agent needs a decision, a review or an approval, it shows up here. To connect an agent, open <a href="#/setup">Set up</a>.</span></div>'}</section>
  ${done ? `<section><h2>Recently answered</h2><div class="tablewrap"><table><tr><th>From</th><th>Item</th><th>Outcome</th><th>When</th></tr>${done}</table></div></section>` : ""}`;
}
async function updateInboxCount() {
  updateNowBar();
  try { const ib = await api("/api/inbox"); const el = $("#inboxcnt"); el.textContent = ib.items.length; el.classList.toggle("ask", ib.items.length > 0); } catch (e) { /* signed out */ }
}

// ---------- Discussions (agents talking to each other) ----------
const OUTCOME = {agreed: "Agreed", overruled: "Overruled by a higher level", sent_to_user: "Sent to you"};
function discussionRow(d) {
  return `<div class="card" data-discussion="${esc(d.id)}"><div class="row" style="margin:0;justify-content:space-between"><a class="t" href="#/discussions/${esc(d.id)}">${esc(d.title)}</a><span>${d.status === "open" ? pill("open", "run") : pill(OUTCOME[d.outcome] || d.outcome, d.outcome === "sent_to_user" ? "ask" : "ok")}</span></div>
  <div class="meta"><span>${d.participants.map(who).join(", ") || "no one yet"}</span><span>${d.post_count} message(s)</span><span>updated ${esc(ago(d.updated_at))}</span>${d.task_id ? `<a href="#/tasks/${esc(d.task_id)}">task</a>` : ""}</div></div>`;
}
async function renderDiscussions() {
  const all = await api("/api/discussions?status=all");
  const open = all.filter(d => d.status === "open"), closed = all.filter(d => d.status !== "open");
  $("#sub").textContent = "Agents talk to each other here. A discussion ends as agreed, overruled by a higher level, or sent to you.";
  $("#view").innerHTML = `<section><h2>Open <span class="cnt">${open.length}</span></h2>${open.map(discussionRow).join("") || '<div class="card"><span class="empty">No open discussions. An agent starts one with <code>ws discuss</code>.</span></div>'}</section>
  ${closed.length ? `<section><h2>Closed <span class="cnt">${closed.length}</span></h2>${closed.map(discussionRow).join("")}</section>` : ""}`;
}
async function renderDiscussion(id) {
  const d = await api(`/api/discussions/${encodeURIComponent(id)}`);
  $("#sub").textContent = d.status === "open" ? "Open. The agents post and close it themselves." : "Closed: " + (OUTCOME[d.outcome] || d.outcome) + ".";
  const posts = d.posts.map(p => `<div class="card"><div class="meta"><span>${who(p.author)}</span><span>${esc(fmt(p.at))}</span>${p.stance !== "none" ? pill(p.stance, p.stance === "agree" ? "ok" : "bad") : ""}</div><div class="body">${md(p.text)}</div></div>`).join("");
  const st = Object.entries(d.stances).map(([a, v]) => `${who(a)} ${esc(v)}`).join(" · ");
  $("#view").innerHTML = `<section><div class="more"><h2 style="margin:0" data-disc-title>${esc(d.title)}</h2><a href="#/discussions">All discussions</a></div>
  <div class="meta"><span>${d.status === "open" ? pill("open", "run") : pill(OUTCOME[d.outcome] || d.outcome, d.outcome === "sent_to_user" ? "ask" : "ok")}</span><span>latest stances: ${st || "none"}</span>${d.task_id ? `<a href="#/tasks/${esc(d.task_id)}">task</a>` : ""}${d.closed_by ? `<span>closed by ${who(d.closed_by)}</span>` : ""}${d.ask_id ? '<a href="#/inbox">waiting in your inbox</a>' : ""}</div>
  ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}${posts || '<div class="card"><span class="empty">No messages yet.</span></div>'}</section>`;
}

// ---------- Decisions ----------
async function renderDecisions() {
  const ds = await api("/api/decisions");
  const open = ds.filter(d => d.status === "pending"), closed = ds.filter(d => d.status !== "pending");
  $("#sub").textContent = "Choices where you pick the option. Only you can resolve them; an approval creates one task for the agent.";
  $("#view").innerHTML = `<section><h2>Waiting for you <span class="cnt">${open.length}</span></h2>${open.map(d => decisionCard(d, true)).join("") || '<div class="card"><span class="empty">No decisions are waiting. Agents propose them, and you can draft one from a <a href="#/threads">thread</a> where both assistants answered.</span></div>'}</section>
  ${closed.length ? `<section><h2>Resolved <span class="cnt">${closed.length}</span></h2>${closed.map(d => decisionCard(d, true)).join("")}</section>` : ""}`;
}

// ---------- Time ----------
const PURPOSES = ["Focus", "Entertainment", "Other", "Untagged"];
const hm = sec => { const m = Math.round(sec / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " m"; };
function timeBody(t, compact) {
  if (t.state !== "connected") {
    const label = t.state === "off" ? "Time tracking is off" : t.state === "unreadable" ? "Daybook could not be read" : "Not connected";
    return `<div class="card"><div class="t">${esc(label)}</div><p>${esc(t.message)}</p></div>`;
  }
  const size = d => Math.max(d.seconds || 0, PURPOSES.reduce((a, p) => a + (d.by_purpose ? d.by_purpose[p] : 0), 0));
  const max = Math.max(1, ...t.days.map(size));
  const bars = t.days.map(d => d.recorded
    ? `<div class="bar"><span>${esc(d.date)}</span><div class="track" title="${esc(PURPOSES.map(p => p + " " + hm(d.by_purpose[p])).join(", "))}">${PURPOSES.map(p => d.by_purpose[p] ? `<span class="p-${p}" style="width:${(d.by_purpose[p] / max * 100).toFixed(2)}%"></span>` : "").join("")}</div><span>${esc(hm(d.seconds))}</span></div>`
    : `<div class="bar"><span>${esc(d.date)}</span><span class="note">not recorded${d.date === t.end ? " yet (Daybook records finished days)" : ""}</span><span></span></div>`).join("");
  const sum = PURPOSES.filter(p => t.by_purpose[p]).map(p => `${p} ${hm(t.by_purpose[p])}`).join(" · ");
  const latest = t.days.filter(d => d.recorded).at(-1);
  return `${t.message ? `<div class="banner">${esc(t.message)}</div>` : ""}${t.demo ? `<div class="banner">Daybook is showing its fictional demo data.</div>` : ""}
  <div class="card"><span class="k">${latest ? "Latest recorded day, " + esc(latest.date) : "Latest recorded day"}</span><span class="big">${latest ? esc(hm(latest.seconds)) : "none yet"}</span>
    <div class="meta">${latest ? esc(PURPOSES.filter(p => latest.by_purpose[p]).map(p => p + " " + hm(latest.by_purpose[p])).join(" · ")) : ""}</div>
    <div class="meta">${t.today && t.today.recorded ? "" : "Today is not recorded yet. "}Last 7 days (${t.recorded_days} recorded): ${esc(hm(t.total_seconds))}${sum ? " · " + esc(sum) : ""}</div></div>
  <div class="legend">${PURPOSES.map(p => `<span><i class="p-${p}"></i>${p}</span>`).join("")}<span>Bar length: time that day, one scale for all days</span></div>
  <div class="bars">${bars}</div>
  ${compact ? `<p class="note"><a href="#/time">Full view</a></p>` : `<p class="note">${t.notes.map(esc).join(" ")}${t.scope ? " Scope: " + esc(t.scope) + "." : ""}</p>`}`;
}
async function renderTime() {
  const t = await api("/api/time");
  $("#sub").textContent = "Where your time went, from Daybook on this computer. Read when you open this page; nothing is stored.";
  $("#view").innerHTML = `<section><h2>Time per day, ${esc(t.start)} to ${esc(t.end)}</h2>${timeBody(t, false)}</section>`;
}

// ---------- Set up (first run) ----------
let SNIP = {};
function setupPanel(s) {
  SNIP = {...Object.fromEntries(Object.entries(s.snippets).map(([k, v]) => [k, v.text])), test: s.test_command};
  const agents = s.agents.map(a => `<div class="row" style="margin:4px 0"><span class="who ${esc(a.id)}">${esc(a.display)}</span>${a.has_token ? `<span class="ok-line">Token ready</span><button data-token="${esc(a.id)}" data-label="replace the token (the agent must be set up again)">Replace token</button>` : `<button class="primary" data-token="${esc(a.id)}">Create token</button>`}</div>`).join("");
  const snip = (key, title) => s.snippets[key].text ? `<details class="card" style="margin:6px 0"><summary>${esc(title)}</summary><div class="note">Paste into: ${esc(s.snippets[key].into)}</div><pre class="cmd">${esc(s.snippets[key].text)}</pre><div class="row"><button data-copy="${esc(key)}">Copy</button><span class="note" data-copymsg></span></div></details>` : "";
  const added = s.agents.filter(a => a.custom && a.instructions).map(a => { SNIP["agent:" + a.id] = a.instructions;
    return `<details class="card" style="margin:6px 0"><summary>${esc(a.display)}: instructions</summary><div class="note">Paste into the file ${esc(a.display)} reads for project rules (AGENTS.md or CLAUDE.md, or its own instructions). The name <code>${esc(a.id)}</code> and this install's folders are filled in.</div><pre class="cmd">${esc(a.instructions)}</pre><div class="row"><button data-copy="${esc("agent:" + a.id)}">Copy</button><span class="note" data-copymsg></span></div></details>`; }).join("");
  const addForm = `<details class="card" style="margin:6px 0"><summary>Add another agent (Codex, Claude Code, Muse, any other)</summary><form id="addagent"><div class="row"><input name="id" placeholder="name, e.g. muse" pattern="[a-z][a-z0-9\-]{0,31}" maxlength="32" required style="width:auto"><input name="display" placeholder="shown as (optional), e.g. Muse" maxlength="40" style="width:auto"><button class="primary">Add and create token</button></div><div class="note">Lowercase letters, digits and -. It gets its own token and instructions, and appears under Your agents. It can submit items and work on tasks; it cannot answer, accept, reassign or change settings.</div><div class="err"></div></form></details>`;
  return `<div class="card"><ol class="steps">
    <li><h3>Give each agent a token</h3><div class="note">A token is a file in this install's data folder that lets one agent submit items. It cannot answer them.</div>${agents}</li>
    <li><h3>Teach the agent to ask you</h3>${s.is_checkout ? snip("codex", "Codex: AGENTS.md text") + snip("claude_skill", "Claude Code: skill (recommended)") + snip("claude_md", "Claude Code: CLAUDE.md text instead") : '<div class="note">The ready-made text ships in the source checkout (docs/agent-instructions).</div>'}${added}${addForm}<div class="note">The folders in these texts are filled in for this install.</div></li>
    <li><h3>Send a test item</h3><div class="note">Run this in a terminal, or ask the agent to. This page notices the item by itself.</div><pre class="cmd">${esc(s.test_command)}</pre><div class="row"><button data-copy="test">Copy command</button><span class="note" data-copymsg></span></div>
    <div>${s.first_item ? '<span class="ok-line">First item received. Open the <a href="#/inbox">Inbox</a> to answer it.</span>' : '<span class="note">Waiting for the first item…</span>'}</div></li></ol></div>`;
}
async function renderSetup() {
  const s = await api("/api/setup"); SNIP.test = s.test_command;
  $("#sub").textContent = "Connect Codex or Claude Code so they can ask you for things.";
  $("#view").innerHTML = `<section><h2>Connect an agent</h2>${setupPanel(s)}</section>
  ${await reminderSettings()}
  <section><h2>What this dashboard can see</h2><div class="card"><ul class="cov">${s.coverage.map(c => `<li>${esc(c.source)}: <b>${esc(c.state)}</b></li>`).join("")}</ul></div></section>`;
}

// ---------- router, polling, events ----------
let seq = -1, busy = false, again = false;
async function route(force) {
  const h = location.hash.replace(/^#/, "") || "/";
  const [path] = h.split("?"); const parts = path.split("/").filter(Boolean);
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.nav === (parts[0] || "home") ? "page" : "false"));
  if (busy) { again = true; return; } busy = true;
  try {
    if (!parts.length) await renderHome();
    else if (parts[0] === "threads" && parts[1]) await renderThread(parts[1]);
    else if (parts[0] === "threads") await renderThreads();
    else if (parts[0] === "tasks" && parts[1]) await renderTask(parts[1]);
    else if (parts[0] === "tasks") await renderTasks();
    else if (parts[0] === "discussions" && parts[1]) await renderDiscussion(parts[1]);
    else if (parts[0] === "discussions") await renderDiscussions();
    else if (parts[0] === "decisions" && parts[1]) await renderDecision(parts[1]);
    else if (parts[0] === "decisions") await renderDecisions();
    else if (parts[0] === "setup") await renderSetup();
    else if (parts[0] === "activity") await renderActivity();
    else if (parts[0] === "review") await renderReview(parts[1]);
    else if (parts[0] === "inbox") await renderInbox();
    else if (parts[0] === "time") await renderTime();
    $("#offline").classList.add("hidden");
    if (parts[0] !== "inbox") updateInboxCount(); else updateNowBar();
  } catch (e) { if (e.message !== "signed out") { $("#offline").textContent = "Could not load: " + e.message; $("#offline").classList.remove("hidden"); } }
  finally { busy = false; }
  if (again) { again = false; await route(); }  // the hash changed while rendering
}
let tick = 0;
async function poll() {
  if (++tick % 30 === 0) updateNowBar();  // the clock moves without events: quiet hours, snoozes ending
  try {
    const v = await api("/api/version");
    $("#offline").classList.add("hidden");
    const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName) && document.activeElement.id !== "composer";
    if (seq === -1) seq = v.seq;  // route() already rendered this state
    else if (v.seq !== seq && !typing) { seq = v.seq; await route(); }
  } catch (e) { if (e.message !== "signed out") { $("#offline").textContent = "Workstation server unreachable — showing the last loaded state. Start it with `uv run ws serve`."; $("#offline").classList.remove("hidden"); } }
}
async function refresh() { const v = await api("/api/version"); seq = v.seq; await route(); }
window.addEventListener("hashchange", () => route());
document.addEventListener("click", async ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const err = m => { const el = $("#threaderr") || $("#taskerr") || $("#editerr"); if (el) el.textContent = m; else alert(m); };
  try {
    if (b.dataset.review) {
      const msg = document.querySelector("[data-recmsg]");
      const rec = await api(`/api/review/record?end=${encodeURIComponent(b.dataset.end)}`);
      if (b.dataset.review === "copy") { await navigator.clipboard.writeText(rec.markdown); msg.textContent = "Copied. Paste it into a weekly note or your repo as " + rec.filename; }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rec.markdown], {type: "text/markdown"})); a.download = rec.filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); msg.textContent = "Saved " + rec.filename; }
      return; }
    if (b.dataset.rec) {
      const msg = b.closest(".dc").querySelector("[data-recmsg]");
      const rec = await api(`/api/decisions/${encodeURIComponent(b.dataset.id)}/record`);
      if (b.dataset.rec === "copy") { await navigator.clipboard.writeText(rec.markdown); msg.textContent = "Copied. Paste it into your repo, for example docs/decisions/" + rec.filename; }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rec.markdown], {type: "text/markdown"})); a.download = rec.filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); msg.textContent = "Saved " + rec.filename; }
      return; }
    if (b.dataset.copy) {
      await navigator.clipboard.writeText(SNIP[b.dataset.copy] || ""); const m = b.parentElement.querySelector("[data-copymsg]"); if (m) m.textContent = "Copied"; return; }
    if (b.dataset.token) {
      if (b.dataset.label && !b.dataset.armed) { b.dataset.armed = "1"; b.dataset.text = b.textContent; b.textContent = "Confirm: " + b.dataset.label;
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.text; } }, 5000); return; }
      b.disabled = true; await api(`/api/setup/token/${encodeURIComponent(b.dataset.token)}`, {method: "POST"}); }
    else if (b.dataset.ans) {
      if (b.dataset.label && !b.dataset.armed) { b.dataset.armed = "1"; b.dataset.text = b.textContent; b.textContent = `Confirm ${b.dataset.label}`;
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.text; } }, 5000); return; }
      b.disabled = true;
      const card = b.closest(".ib"); try { await api(`/api/asks/${encodeURIComponent(b.dataset.ans)}/answer`, {method: "POST", body: {resolution: b.dataset.res, note: card.querySelector(".anote").value.trim()}}); }
      catch (e) { card.querySelector(".err").textContent = e.message; b.disabled = false; return; } }
    else if (b.dataset.snooze) { b.disabled = true; await api("/api/snooze", {method: "POST", body: {key: b.dataset.snooze, minutes: +b.dataset.min}}); }
    else if (b.dataset.unsnooze) { b.disabled = true; await api("/api/unsnooze", {method: "POST", body: {key: b.dataset.unsnooze}}); }
    else if ("pause" in b.dataset) { b.disabled = true; await api("/api/reminders/pause", {method: "POST", body: {minutes: b.dataset.pause === "" ? null : +b.dataset.pause}}); }
    else if (b.dataset.resume) { b.disabled = true; await api("/api/reminders/resume", {method: "POST"}); }
    else if (b.dataset.task) { b.disabled = true; await api(`/api/tasks/${b.dataset.task}`, {method: "PATCH", body: {expected_version: +b.dataset.v, changes: {status: b.dataset.status}}}); }
    else if (b.dataset.approve || b.dataset.resolve) {
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.dataset.text = b.textContent; b.textContent = b.dataset.approve ? `Confirm: approve “${b.dataset.label}”` : `Confirm ${b.dataset.s === "deferred" ? "defer" : "reject"}`;
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.text; } }, 5000); return; }
      b.disabled = true;
      const card = b.closest(".dc"), why = {note: card.querySelector(".dnote").value.trim(), revisit: card.querySelector(".drev").value.trim()};
      if (b.dataset.approve) await api(`/api/decisions/${b.dataset.approve}/resolve`, {method: "POST", body: {status: "approved", option_id: b.dataset.o, ...why}});
      else await api(`/api/decisions/${b.dataset.resolve}/resolve`, {method: "POST", body: {status: b.dataset.s, ...why}}); }
    else if (b.dataset.insert) { const ta = $("#composer"); ta.value = (ta.value && !ta.value.endsWith(" ") ? ta.value + " " : ta.value) + b.dataset.insert; ta.focus(); return; }
    else if (b.dataset.propose) { b.disabled = true; await api("/api/tasks", {method: "POST", body: {...JSON.parse(b.dataset.propose), status: "inbox"}}); }
    else if (b.id === "send") { const ta = $("#composer"), text = ta.value.trim(); if (!text) return; b.disabled = true; const id = encodeURIComponent(location.hash.split("/")[2]);
      await api(`/api/threads/${id}/messages`, {method: "POST", body: {text, idempotency_key: crypto.randomUUID()}}); ta.value = ""; }
    else if (b.id === "critique") { b.disabled = true; await api(`/api/threads/${encodeURIComponent(location.hash.split("/")[2])}/critique`, {method: "POST"}); }
    else if (b.id === "draft") { showDraft(await api(`/api/threads/${encodeURIComponent(location.hash.split("/")[2])}/decision-draft`)); return; }
    else if (b.id === "canceldraft") { draftCache = null; $("#draftbox").innerHTML = ""; return; }
    else return;
    await refresh();
  } catch (e) { err(e.message); b.disabled = false; }
});
document.addEventListener("keydown", ev => { if (ev.target.id === "composer" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); $("#send").click(); } });
document.addEventListener("submit", async ev => {
  ev.preventDefault(); const f = ev.target, fd = Object.fromEntries(new FormData(f));
  try {
    if (f.id === "newthread") { const t = await api("/api/threads", {method: "POST", body: {title: fd.title, project_id: fd.project_id, idempotency_key: crypto.randomUUID()}}); location.hash = `#/threads/${t.id}`; return; }
    if (f.id === "newtask") { await api("/api/tasks", {method: "POST", body: {title: fd.title, next_action: fd.next_action, project_id: fd.project_id, owner: fd.owner, priority: fd.priority, status: "ready",
      due_at: fd.due || null, due_tz: fd.due ? Intl.DateTimeFormat().resolvedOptions().timeZone : null, idempotency_key: crypto.randomUUID()}}); }
    if (f.id === "edittask") { const d = await api(`/api/tasks/${f.dataset.id}`); const changes = {};
      for (const k of ["title", "next_action", "status", "owner", "priority"]) if (fd[k] !== (d[k] ?? "")) changes[k] = fd[k];
      if (Object.keys(changes).length) await api(`/api/tasks/${f.dataset.id}`, {method: "PATCH", body: {expected_version: +f.dataset.v, changes}}); }
    if (f.id === "decform") { const d = draftCache; await api("/api/decisions", {method: "POST", body: {question: fd.question, context: fd.context, project_id: d.project_id, thread_id: d.thread_id,
      options: fd.options.split("\n").map(s => s.trim()).filter(Boolean).map(label => ({label, detail: (d.options.find(o => o.label === label) || {}).detail || ""})), recommendations: d.recommendations, evidence: d.evidence, urgency: fd.urgency, follow_up_owner: fd.follow_up_owner,
      idempotency_key: crypto.randomUUID()}}); draftCache = null; }
    if (f.id === "addagent") { await api("/api/agents", {method: "POST", body: {id: fd.id, display: fd.display || null}});
      const p = await api("/api/principals");
      for (const [id, a] of Object.entries(p.principals)) NAMES[id] = a.display;
      AGENT_IDS = Object.entries(p.principals).filter(([, a]) => a.kind === "agent").map(([id]) => id); }
    if (f.id === "taskfilter") { const q = new URLSearchParams(Object.entries(fd).filter(([, v]) => v)); location.hash = "#/tasks?" + q; return; }
    await refresh();
  } catch (e) { const el = f.querySelector(".err") || $("#threaderr"); if (el) el.textContent = e.message; else alert(e.message); }
});
(async () => {
  try {
    const p = await api("/api/principals");
    OWNER = p.owner;
    for (const [id, a] of Object.entries(p.principals)) NAMES[id] = a.display;
    AGENT_IDS = Object.entries(p.principals).filter(([, a]) => a.kind === "agent").map(([id]) => id);
  } catch (e) { /* signed out: route() shows how to sign in */ }
  route(); setInterval(poll, 2000);
})();
</script>
