# Copy to data/config.toml (or <your data dir>/config.toml) and edit. Every key is optional.
# Restart `ws serve` after a change.

[owner]
# Stable id recorded in the event log. Lowercase letters, digits, - or _.
# Set it before the first start; changing it later orphans earlier records.
id = "owner"
# Shown in the dashboard and in the agents' prompts.
name = "Owner"

[display]
# IANA time zone used for "today", "this week" and displayed deadlines.
timezone = "UTC"

[server]
port = 8770

[inbox]
# Open items one agent may have waiting on you. A default chosen by the project, not a researched value.
max_open_per_agent = 20

[time]
# Where the Time page reads from: "daybook" (default) or "off". Daybook is read through its own loopback page;
# nothing is stored. The address must be loopback (127.0.0.1, localhost or [::1]).
source = "daybook"
daybook_url = "http://127.0.0.1:8765"
# Which Daybook device scope to show, by the id Daybook uses (for example "all_devices"). Empty: the scope with the
# latest recorded day. A name Daybook does not have falls back to that default, with a note on the Time page.
daybook_scope = ""

[reminders]
# Optional local fallback for people with no personal assistant; off by default. Your agents or assistant should read
# `ws now` / GET /api/needs-now instead. Set true to turn the rule below on (banner, pause, reminder log, `ws remind`).
enabled = false
# The first reminder rule. Every value here is a default chosen by this project, not a researched number; change freely.
# An item is "due" when it has waited past the threshold for its urgency (minutes), is overdue, or its deadline is
# within deadline_window_minutes. A due item is reminded only outside quiet hours, while the day's cap is not used up,
# not again inside repeat_minutes, and never once it is answered or snoozed. The page's pause switch stops all reminders.
wait_minutes_high = 30
wait_minutes_normal = 240
wait_minutes_low = 1440
deadline_window_minutes = 1440
quiet_start = "21:00"   # local time in [display] timezone; start later than end means across midnight
quiet_end = "08:00"
daily_cap = 3
repeat_minutes = 1440
acted_window_minutes = 120   # reminder log: "acted on" means answered within this long after the reminder

[agents.claude]
# Model alias or id passed to `claude -p --model`.
model = "sonnet"

[agents.gpt]
# Model id passed to `codex exec -m`, and its reasoning effort (low, medium, high).
model = "gpt-6-astra"
effort = "medium"

# What the dashboard can and cannot see, shown on Home. Replace the defaults to match your setup.
# Add agent = "claude" (or "gpt", "gemini") to an entry to show that agent's live status instead of the fixed text.
[[coverage]]
source = "Claude Code (threads, engineering tasks)"
state = "connected"
agent = "claude"

[[coverage]]
source = "GPT via Codex CLI (threads, reviews)"
state = "connected"
agent = "gpt"

[[coverage]]
source = "Mail and calendar"
state = "not connected; nothing from mail is shown"

# Optional: show the open tickets of a Markdown file on Home. Read-only; the file is never written.
# Blocks look like "## T-0001 · Title" followed by "- status: ...", "- priority: ...", "- repo: ..." lines.
# A ticket is closed when the first word of its status is in `closed`.
# [tickets]
# path = "~/notes/tickets.md"
# title = "Tickets"
# closed = ["done", "closed", "canceled"]
